<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title desc"><title id="title">DOMAINCORE identity and endpoint architecture</title><desc id="desc">A designed identity flow from a reviewed access request to Active Directory organizational units and groups, managed Windows endpoints, and optional Entra ID and Intune services.</desc><defs><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4267b2"/><stop offset="1" stop-color="#254477"/></linearGradient><style>.label{font:700 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.small{font:12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.edge{stroke:#7890ab;stroke-width:2;fill:none}.dash{stroke-dasharray:7 7}</style></defs><rect x="18" y="30" width="684" height="280" rx="24" fill="#f4f7fb" stroke="#dce5ef"/><rect x="42" y="108" width="150" height="84" rx="16" fill="#fff" stroke="#dce5ef"/><text class="label" x="117" y="140" text-anchor="middle" fill="#122035">ACCESS REQUEST</text><text class="small" x="117" y="163" text-anchor="middle" fill="#4d6075">reviewed inputs</text><path class="edge" d="M192 150h42"/><rect x="234" y="72" width="220" height="156" rx="20" fill="url(#core)"/><text class="label" x="344" y="105" text-anchor="middle" fill="#fff">ACTIVE DIRECTORY</text><rect x="260" y="122" width="82" height="70" rx="12" fill="#fff" fill-opacity=".96"/><text class="small" x="301" y="151" text-anchor="middle" fill="#122035">OUs</text><text class="small" x="301" y="171" text-anchor="middle" fill="#4d6075">delegation</text><rect x="350" y="122" width="82" height="70" rx="12" fill="#fff" fill-opacity=".96"/><text class="small" x="391" y="151" text-anchor="middle" fill="#122035">Groups</text><text class="small" x="391" y="171" text-anchor="middle" fill="#4d6075">least privilege</text><path class="edge" d="M454 150h42"/><rect x="496" y="108" width="164" height="84" rx="16" fill="#fff" stroke="#dce5ef"/><text class="label" x="578" y="140" text-anchor="middle" fill="#122035">ENDPOINTS</text><text class="small" x="578" y="163" text-anchor="middle" fill="#4d6075">policy &amp; inventory</text><path class="edge dash" d="M344 228v38h110"/><rect x="454" y="248" width="206" height="42" rx="13" fill="#edf3ff" stroke="#ceddf9"/><text class="small" x="557" y="274" text-anchor="middle" fill="#244f98">Entra ID / Intune · external</text><text class="small" x="46" y="284" fill="#4d6075">Designed topology · no directory or tenant deployed</text></svg>
